# Labelled evaluation set for kb/umoja-sacco.yaml (synthetic, written by the author).
#
# Each case:  [kind, expected, question]            or, for follow-ups,
#             [followup, expected, question, earlier_question_in_same_session]
#   kind      en | sw | mixed (code-switching, incl. light Sheng) | typo | followup | oos | smalltalk
#   expected  an entry id, "@smalltalk", or ~ (null) meaning "must hand off to a human"
#
# Split rule (see jibu/evaluation.py): case number n (0-based) is "dev" when n % 5 is 0, 1 or 2,
# otherwise "test". Thresholds and stemmer/synonym choices were tuned on dev only.
# "as_of" fixes today's date so entry validity windows are deterministic.

