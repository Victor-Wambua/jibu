<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14213d"/></marker></defs>
<style>.b{fill:#fff;stroke:#14213d;stroke-width:1.6}.h{fill:#14213d}.t{fill:#14213d}.w{fill:#fff}.m{fill:#566074;font-size:12px}.l{stroke:#14213d;stroke-width:1.6;fill:none;marker-end:url(#a)}.acc{fill:#fca311;stroke:#14213d;stroke-width:1.6}</style>
<rect width="960" height="340" fill="#faf8f4"/>
<rect class="b" x="20" y="40" width="150" height="70" rx="10"/><text class="t" x="95" y="70" text-anchor="middle" font-weight="700">Web widget</text><text class="m" x="95" y="90" text-anchor="middle">shadow DOM, 1 file</text>
<rect class="b" x="20" y="150" width="150" height="70" rx="10"/><text class="t" x="95" y="180" text-anchor="middle" font-weight="700">WhatsApp</text><text class="m" x="95" y="200" text-anchor="middle">Cloud API webhook</text>
<rect class="b" x="20" y="260" width="150" height="56" rx="10"/><text class="t" x="95" y="285" text-anchor="middle" font-weight="700">CLI</text><text class="m" x="95" y="303" text-anchor="middle">ask / eval / kb check</text>
<rect class="b" x="230" y="90" width="170" height="140" rx="10"/><text class="t" x="315" y="118" text-anchor="middle" font-weight="700">FastAPI</text><text class="m" x="315" y="142" text-anchor="middle">/chat  /feedback</text><text class="m" x="315" y="160" text-anchor="middle">rate limit per IP</text><text class="m" x="315" y="178" text-anchor="middle">HMAC check (WhatsApp)</text><text class="m" x="315" y="196" text-anchor="middle">sessions: last entry id</text><text class="m" x="315" y="214" text-anchor="middle">/admin (bearer token)</text>
<rect class="h" x="460" y="30" width="260" height="280" rx="12"/><text class="w" x="590" y="58" text-anchor="middle" font-weight="700">Engine over kb/*.yaml (no LLM)</text>
<g class="w" font-size="13"><text x="480" y="90">1  detect language  en / sw / mixed</text><text x="480" y="118">2  tokenise, stop-words, stem</text><text x="480" y="146">3  spell-fix against KB words</text><text x="480" y="174">4  synonym expansion (concepts)</text><text x="480" y="202">5  BM25 over questions + answers</text><text x="480" y="230">6  confidence from coverage,</text><text x="480" y="248">   margin and score</text></g>
<rect class="acc" x="480" y="266" width="220" height="30" rx="8"/><text class="t" x="590" y="286" text-anchor="middle" font-weight="700">confidence &gt;= threshold ?</text>
<rect class="b" x="780" y="50" width="160" height="80" rx="10"/><text class="t" x="860" y="80" text-anchor="middle" font-weight="700">Answer</text><text class="m" x="860" y="100" text-anchor="middle">verbatim approved</text><text class="m" x="860" y="116" text-anchor="middle">text, en or sw</text>
<rect class="acc" x="780" y="170" width="160" height="80" rx="10"/><text class="t" x="860" y="200" text-anchor="middle" font-weight="700">Handoff</text><text class="m" x="860" y="220" text-anchor="middle" style="fill:#14213d">contact details +</text><text class="m" x="860" y="236" text-anchor="middle" style="fill:#14213d">unanswered queue</text>

<path class="l" d="M170 75 L228 130"/><path class="l" d="M170 185 L228 165"/><path class="l" d="M170 288 L228 215" /><path class="l" d="M400 160 L458 160"/><path class="l" d="M722 100 L778 90"/><path class="l" d="M722 215 L778 210"/>
<text class="m" x="745" y="84">yes</text><text class="m" x="745" y="208">no</text>
</svg>